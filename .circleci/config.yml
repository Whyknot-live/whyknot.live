version: 2.1

# Bun-first executors (Node 24 LTS inside via bun; TS 7 native, oxlint)
executors:
  bun-executor:
    docker:
      - image: oven/bun:1.3.14
    working_directory: ~/project

# Define reusable commands
commands:
  restore-backend-cache:
    description: "Restore backend node_modules cache"
    steps:
      - restore_cache:
          keys:
            - backend-deps-v1-{{ checksum "backend/bun.lock" }}
            - backend-deps-v1-
  
  restore-frontend-cache:
    description: "Restore frontend node_modules cache"
    steps:
      - restore_cache:
          keys:
            - frontend-deps-v1-{{ checksum "frontend/bun.lock" }}
            - frontend-deps-v1-

# Define jobs
jobs:
  # Backend jobs
  backend-install:
    executor: bun-executor
    steps:
      - checkout
      - restore-backend-cache
      - run:
          name: Install backend dependencies
          command: |
            cd backend
            bun install --frozen-lockfile
      - save_cache:
          key: backend-deps-v1-{{ checksum "backend/bun.lock" }}
          paths:
            - backend/node_modules
      - persist_to_workspace:
          root: .
          paths:
            - backend/node_modules

  backend-lint:
    executor: bun-executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Lint backend code (oxlint)
          command: |
            cd backend
            bun run lint

  backend-typecheck:
    executor: bun-executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: TypeScript 7 type check (backend)
          command: |
            cd backend
            bun run typecheck

  backend-test:
    executor: bun-executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Run backend tests
          command: |
            cd backend
            bun test

  backend-build:
    executor: bun-executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Build backend
          command: |
            cd backend
            bun run build
      - persist_to_workspace:
          root: .
          paths:
            - backend/dist

  # Frontend jobs
  frontend-install:
    executor: bun-executor
    steps:
      - checkout
      - restore-frontend-cache
      - run:
          name: Install frontend dependencies
          command: |
            cd frontend
            bun install --frozen-lockfile
      - save_cache:
          key: frontend-deps-v1-{{ checksum "frontend/bun.lock" }}
          paths:
            - frontend/node_modules
      - persist_to_workspace:
          root: .
          paths:
            - frontend/node_modules

  frontend-lint:
    executor: bun-executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Lint frontend code (oxlint)
          command: |
            cd frontend
            bun run lint

  frontend-typecheck:
    executor: bun-executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: TypeScript 7 type check (frontend)
          command: |
            cd frontend
            bun run typecheck

  frontend-build:
    executor: bun-executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Build frontend for production (SSG)
          command: |
            cd frontend
            bun run build
      - persist_to_workspace:
          root: .
          paths:
            - frontend/dist

  # Security scanning job
  security-scan:
    executor: bun-executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Run security audit
          command: |
            echo "Running security audit..."
            bun audit --cwd backend || true
            bun audit --cwd frontend || true
            echo "✓ Security audit complete"

  # Deploy to staging environment
  deploy-staging:
    executor: bun-executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Deploy to staging
          command: |
            echo "Deploying to staging environment..."
            echo "Using GitHub Environment: staging"
            # GitHub Environment variables available:
            # - $STAGING_API_KEY
            # - $STAGING_DB_URI
            # - $STAGING_DEPLOY_TOKEN
            # Add your staging deployment commands here
            # Example: railway deploy --environment staging

  # Deploy to production environment
  deploy-production:
    executor: bun-executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Deploy to production
          command: |
            echo "Deploying to production environment..."
            echo "Using GitHub Environment: production"
            echo "Protection: Required reviewer + 15 min wait timer"
            # GitHub Environment variables available:
            # - $PRODUCTION_API_KEY
            # - $PRODUCTION_DB_URI
            # - $PRODUCTION_DEPLOY_TOKEN
            # - $NODE_ENV
            # - $API_BASE_URL
            # Add your production deployment commands here
            # Example: railway deploy --environment production

  # Smoke tests after deployment
  smoke-tests:
    executor: bun-executor
    steps:
      - run:
          name: Run smoke tests
          command: |
            echo "Running smoke tests..."
            # Add basic health check commands
            # curl -f https://api.whyknot.live/health || exit 1
            echo "✓ Smoke tests passed"

# Define workflows
workflows:
  # Workflow 1: Development (feature/*, fix/*, develop branches)
  development:
    jobs:
      # Install dependencies (parallel)
      - backend-install:
          filters:
            branches:
              only:
                - develop
                - /feature\/.*/
                - /fix\/.*/
      
      - frontend-install:
          filters:
            branches:
              only:
                - develop
                - /feature\/.*/
                - /fix\/.*/

      # Quality checks (parallel, requires install)
      - backend-lint:
          requires:
            - backend-install
      
      - backend-typecheck:
          requires:
            - backend-install
      
      - backend-test:
          requires:
            - backend-install

      - frontend-lint:
          requires:
            - frontend-install
      
      - frontend-typecheck:
          requires:
            - frontend-install

      # Build (requires all checks pass)
      - backend-build:
          requires:
            - backend-lint
            - backend-typecheck
            - backend-test
      
      - frontend-build:
          requires:
            - frontend-lint
            - frontend-typecheck

  # Workflow 2: Staging Deployment
  staging-deployment:
    jobs:
      # Install dependencies (parallel)
      - backend-install:
          filters:
            branches:
              only: staging
      
      - frontend-install:
          filters:
            branches:
              only: staging

      # Quality checks (parallel, requires install)
      - backend-lint:
          requires:
            - backend-install
      
      - backend-typecheck:
          requires:
            - backend-install
      
      - backend-test:
          requires:
            - backend-install

      - frontend-lint:
          requires:
            - frontend-install
      
      - frontend-typecheck:
          requires:
            - frontend-install

      # Build (requires all checks pass)
      - backend-build:
          requires:
            - backend-lint
            - backend-typecheck
            - backend-test
      
      - frontend-build:
          requires:
            - frontend-lint
            - frontend-typecheck

      # Deploy to staging (requires build)
      - deploy-staging:
          requires:
            - backend-build
            - frontend-build
          filters:
            branches:
              only: staging

  # Workflow 3: Production Deployment
  production-deployment:
    jobs:
      # Install dependencies (parallel)
      - backend-install:
          filters:
            branches:
              only: main
      
      - frontend-install:
          filters:
            branches:
              only: main

      # Quality checks (parallel, requires install)
      - backend-lint:
          requires:
            - backend-install
      
      - backend-typecheck:
          requires:
            - backend-install
      
      - backend-test:
          requires:
            - backend-install

      - frontend-lint:
          requires:
            - frontend-install
      
      - frontend-typecheck:
          requires:
            - frontend-install

      # Build (requires all checks pass)
      - backend-build:
          requires:
            - backend-lint
            - backend-typecheck
            - backend-test
      
      - frontend-build:
          requires:
            - frontend-lint
            - frontend-typecheck

      # Security scan (requires build)
      - security-scan:
          requires:
            - backend-build
            - frontend-build
          filters:
            branches:
              only: main

      # Manual approval gate (requires security scan)
      - hold-for-production:
          type: approval
          requires:
            - security-scan
          filters:
            branches:
              only: main

      # Deploy to production (requires approval)
      - deploy-production:
          requires:
            - hold-for-production
          filters:
            branches:
              only: main

      # Smoke tests (requires deploy)
      - smoke-tests:
          requires:
            - deploy-production
          filters:
            branches:
              only: main

  # Workflow 4: Tagged Releases
  tagged-release:
    jobs:
      - backend-install:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      
      - frontend-install:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/

      - backend-lint:
          requires:
            - backend-install
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      
      - backend-typecheck:
          requires:
            - backend-install
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      
      - backend-test:
          requires:
            - backend-install
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/

      - frontend-lint:
          requires:
            - frontend-install
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      
      - frontend-typecheck:
          requires:
            - frontend-install
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/

      - backend-build:
          requires:
            - backend-lint
            - backend-typecheck
            - backend-test
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      
      - frontend-build:
          requires:
            - frontend-lint
            - frontend-typecheck
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/

      - deploy-production:
          requires:
            - backend-build
            - frontend-build
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/.

